<!-- Chat Component -->
<div class="chat-container">
    <div class="chat-header">
        <h2 class="text-2xl font-bold text-center mb-4">AI Chat Assistant</h2>
    </div>

    <div id="chat-messages" class="chat-messages">
        <!-- Messages will be dynamically added here -->
    </div>

    <div class="chat-input-container">
        <input type="text" id="user-input" class="chat-input" placeholder="Type your message...">
        <div class="chat-buttons">
            <button id="voice-btn" class="chat-button voice-button" title="Voice Input">
                <i class="fas fa-microphone"></i>
            </button>
            <button id="send-btn" class="chat-button" title="Send Message">
                <i class="fas fa-paper-plane"></i>
            </button>
        </div>
    </div>
</div>
