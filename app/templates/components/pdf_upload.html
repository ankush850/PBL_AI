<!-- PDF Upload Component -->
<div class="upload-container">
    <div id="upload-area" class="upload-area">
        <i class="fas fa-file-pdf upload-icon"></i>
        <p class="upload-text">Drag and drop your PDF here</p>
        <p class="upload-subtext">or click to browse</p>
        <input type="file" id="pdf-file" accept=".pdf" class="hidden">
        <button id="upload-btn" class="btn btn-primary mt-4">Select PDF</button>
    </div>

    <!-- Loading State -->
    <div id="loading" class="loading hidden">
        <div class="loading-spinner"></div>
    </div>

    <!-- Error Message -->
    <div id="error" class="error-message hidden"></div>

    <!-- Results Section -->
    <div id="results" class="results-container hidden">
        <div class="summary-box">
            <div class="stats">
                <span id="original-length"></span>
                <span id="summary-length"></span>
            </div>
            <p id="summary-text" class="summary-text"></p>
        </div>
        <button id="download-btn" class="btn btn-primary">
            <i class="fas fa-download mr-2"></i>Download Summary
        </button>
    </div>
</div>
